spring:
  application:
    name: llm-gateway

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:llmgateway}
    username: ${POSTGRES_USER:llmgateway}
    password: ${POSTGRES_PASSWORD:llmgateway}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:llmgateway}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: gateway-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.llmgateway.events

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

gateway:
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    embedding-model: ${GEMINI_EMBED_MODEL:gemini-embedding-001}

  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:3600}
    similarity-threshold: ${CACHE_SIMILARITY_THRESHOLD:0.80}
    vector-dimensions: 768

  kafka:
    usage-topic: llm-usage-events

  pricing:
    gemini:
      gemini-3.5-flash:
        input-per-million: 0.15
        output-per-million: 0.60
      gemini-embedding-001:
        input-per-million: 0.00
        output-per-million: 0.00
