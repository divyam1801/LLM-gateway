services:

  # ── Shared Infrastructure ──

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shared-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    container_name: shared-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gateway-only Infrastructure ──

  mongodb:
    image: mongo:7
    container_name: shared-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: shared-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: shared-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── LLM Gateway ──

  gateway:
    build:
      context: ..
      dockerfile: gateway-service/Dockerfile
    container_name: llm-gateway-app
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llmgateway
      REDIS_HOST: redis
      MONGO_HOST: mongodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  dashboard:
    build:
      context: ../dashboard
    container_name: llm-gateway-dashboard
    ports:
      - "5173:5173"
    volumes:
      - ../dashboard/src:/app/src
    environment:
      VITE_API_BASE_URL: http://gateway:8080
    depends_on:
      - gateway

  # ── AI Knowledge Assistant ──

  ka-backend:
    build: ../../ai-knowledge-assistant/backend
    container_name: ka-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge_assistant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-in-production
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GATEWAY_BASE_URL: http://gateway:8080/llm-gateway
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      PYTHONPATH: /app
      DEBUG: "false"
    volumes:
      - ../../ai-knowledge-assistant/backend:/app
      - ka-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

  ka-celery:
    build: ../../ai-knowledge-assistant/backend
    container_name: ka-celery
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/knowledge_assistant
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GATEWAY_BASE_URL: http://gateway:8080/llm-gateway
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      UPLOAD_DIR: /data/uploads
      PYTHONPATH: /app
    volumes:
      - ../../ai-knowledge-assistant/backend:/app
      - ka-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ka-frontend:
    build: ../../ai-knowledge-assistant/frontend
    container_name: ka-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../../ai-knowledge-assistant/frontend/src:/app/src
    depends_on:
      - ka-backend

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  ka-uploads:
